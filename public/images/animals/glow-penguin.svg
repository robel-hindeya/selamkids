<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="penguinBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="80%" stop-color="#101921"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </radialGradient>
    <linearGradient id="penguinBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <filter id="penguinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#penguinGlow)">
    <!-- Little Feet -->
    <ellipse cx="78" cy="182" rx="18" ry="10" fill="#ff9100"/>
    <ellipse cx="122" cy="182" rx="18" ry="10" fill="#ff9100"/>

    <!-- Plump Body -->
    <ellipse cx="100" cy="115" rx="55" ry="68" fill="url(#penguinBody)"/>

    <!-- Flippers (Arms) -->
    <!-- Left Flipper waving happily -->
    <path d="M 48 95 C 28 85 20 70 25 60 C 32 55 46 80 54 90 Z" fill="#263238" transform="rotate(-15 48 95)"/>
    <!-- Right Flipper -->
    <path d="M 152 105 C 175 118 180 135 174 142 C 166 145 152 125 146 112 Z" fill="#263238"/>

    <!-- White Glowing Belly -->
    <ellipse cx="100" cy="125" rx="38" ry="48" fill="url(#penguinBelly)"/>

    <!-- Cozy Red Explorer Scarf -->
    <path d="M 68 108 Q 100 120 132 108 Q 134 118 128 122 Q 100 132 72 122 Z" fill="url(#scarfGrad)"/>
    <!-- Scarf Tails hanging down -->
    <path d="M 74 116 L 68 152 L 84 150 L 86 118 Z" fill="url(#scarfGrad)"/>

    <!-- Big Adorable Eyes -->
    <ellipse cx="80" cy="82" rx="14" ry="17" fill="#0d1117"/>
    <circle cx="76" cy="76" r="6" fill="#ffffff"/>
    <circle cx="83" cy="88" r="2.5" fill="#ffffff"/>

    <ellipse cx="120" cy="82" rx="14" ry="17" fill="#0d1117"/>
    <circle cx="116" cy="76" r="6" fill="#ffffff"/>
    <circle cx="123" cy="88" r="2.5" fill="#ffffff"/>

    <!-- Cheeks -->
    <ellipse cx="62" cy="98" rx="8" ry="5" fill="#ff4081" opacity="0.35"/>
    <ellipse cx="138" cy="98" rx="8" ry="5" fill="#ff4081" opacity="0.35"/>

    <!-- Bright Orange Beak -->
    <path d="M 90 90 Q 100 84 110 90 Q 100 106 90 90 Z" fill="#ff6d00"/>
    <path d="M 94 90 Q 100 93 106 90" stroke="#d50000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
