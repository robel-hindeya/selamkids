<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="owlBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a148c"/>
      <stop offset="70%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </radialGradient>
    <radialGradient id="owlBelly" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </radialGradient>
    <radialGradient id="owlEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="75%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </radialGradient>
    <filter id="owlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ba68c8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#owlGlow)">
    <!-- Little Talons -->
    <ellipse cx="80" cy="182" rx="14" ry="7" fill="#ffb300"/>
    <ellipse cx="120" cy="182" rx="14" ry="7" fill="#ffb300"/>

    <!-- Plump Owl Body -->
    <ellipse cx="100" cy="115" rx="58" ry="66" fill="url(#owlBody)"/>

    <!-- Feathery Ear Tufts / Horns -->
    <path d="M 52 75 C 38 42 54 28 62 48 C 66 58 68 70 70 75 Z" fill="#4a148c"/>
    <path d="M 148 75 C 162 42 146 28 138 48 C 134 58 132 70 130 75 Z" fill="#4a148c"/>

    <!-- Soft Feathered Belly with scalloped pattern -->
    <ellipse cx="100" cy="132" rx="38" ry="42" fill="url(#owlBelly)"/>
    <!-- Scalloped Feather Marks -->
    <path d="M 86 122 Q 92 128 98 122" stroke="#ab47bc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 102 122 Q 108 128 114 122" stroke="#ab47bc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 80 136 Q 88 142 96 136" stroke="#ab47bc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 104 136 Q 112 142 120 136" stroke="#ab47bc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 92 150 Q 100 156 108 150" stroke="#ab47bc" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Wings on sides -->
    <ellipse cx="44" cy="120" rx="14" ry="38" fill="#311b92" transform="rotate(10 44 120)"/>
    <ellipse cx="156" cy="120" rx="14" ry="38" fill="#311b92" transform="rotate(-10 156 120)"/>

    <!-- Giant Glowing Eyes -->
    <!-- Left Eye Disc -->
    <circle cx="72" cy="85" r="24" fill="#ffffff"/>
    <circle cx="72" cy="85" r="20" fill="url(#owlEye)"/>
    <circle cx="72" cy="85" r="12" fill="#120024"/>
    <circle cx="66" cy="78" r="5" fill="#ffffff"/>
    <circle cx="76" cy="90" r="2.5" fill="#ffffff"/>

    <!-- Right Eye Disc -->
    <circle cx="128" cy="85" r="24" fill="#ffffff"/>
    <circle cx="128" cy="85" r="20" fill="url(#owlEye)"/>
    <circle cx="128" cy="85" r="12" fill="#120024"/>
    <circle cx="122" cy="78" r="5" fill="#ffffff"/>
    <circle cx="132" cy="90" r="2.5" fill="#ffffff"/>

    <!-- Cute Curved Owl Beak -->
    <path d="M 94 88 Q 100 84 106 88 L 100 106 Z" fill="#ffb300"/>
    <path d="M 98 88 L 100 105" stroke="#f57f17" stroke-width="1.5"/>
  </g>
</svg>
