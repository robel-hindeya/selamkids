<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="giraffeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="giraffeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ffb300" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#giraffeGlow)">
    <!-- Long Graceful Neck -->
    <path d="M 85 130 L 80 200 L 120 200 L 115 130 Z" fill="url(#giraffeBody)"/>
    <!-- Mane along neck -->
    <path d="M 115 130 Q 125 150 125 200 L 118 200 Z" fill="#e65100"/>
    
    <!-- Star spots on neck -->
    <circle cx="95" cy="155" r="9" fill="url(#spotGrad)"/>
    <circle cx="106" cy="180" r="11" fill="url(#spotGrad)"/>
    <circle cx="90" cy="190" r="8" fill="url(#spotGrad)"/>

    <!-- Head -->
    <ellipse cx="100" cy="105" rx="42" ry="48" fill="url(#giraffeBody)"/>

    <!-- Cute Horns (Ossicones) -->
    <!-- Left Horn -->
    <line x1="82" y1="75" x2="76" y2="45" stroke="#ffb300" stroke-width="8" stroke-linecap="round"/>
    <circle cx="74" cy="42" r="10" fill="#e65100"/>
    <!-- Right Horn -->
    <line x1="118" y1="75" x2="124" y2="45" stroke="#ffb300" stroke-width="8" stroke-linecap="round"/>
    <circle cx="126" cy="42" r="10" fill="#e65100"/>

    <!-- Big Fluffy Ears -->
    <ellipse cx="52" cy="78" rx="20" ry="12" fill="#ffd54f" transform="rotate(-30 52 78)"/>
    <ellipse cx="54" cy="78" rx="12" ry="7" fill="#ff8f00" transform="rotate(-30 54 78)"/>
    <ellipse cx="148" cy="78" rx="20" ry="12" fill="#ffd54f" transform="rotate(30 148 78)"/>
    <ellipse cx="146" cy="78" rx="12" ry="7" fill="#ff8f00" transform="rotate(30 146 78)"/>

    <!-- Snout -->
    <ellipse cx="100" cy="128" rx="26" ry="18" fill="#ffe082"/>

    <!-- Star Spots on Forehead -->
    <polygon points="100,68 103,77 112,77 105,82 107,91 100,85 93,91 95,82 88,77 97,77" fill="#ff8f00"/>

    <!-- Big Innocent Eyes -->
    <ellipse cx="80" cy="98" rx="12" ry="15" fill="#1e1035"/>
    <circle cx="76" cy="92" r="5" fill="#ffffff"/>
    <circle cx="83" cy="103" r="2" fill="#ffffff"/>

    <ellipse cx="120" cy="98" rx="12" ry="15" fill="#1e1035"/>
    <circle cx="116" cy="92" r="5" fill="#ffffff"/>
    <circle cx="123" cy="103" r="2" fill="#ffffff"/>

    <!-- Gentle Eyelashes -->
    <path d="M 68 90 L 62 86" stroke="#1e1035" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 132 90 L 138 86" stroke="#1e1035" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="64" cy="116" rx="8" ry="5" fill="#ff5252" opacity="0.3"/>
    <ellipse cx="136" cy="116" rx="8" ry="5" fill="#ff5252" opacity="0.3"/>

    <!-- Cute Nostrils -->
    <ellipse cx="92" cy="125" rx="3.5" ry="5" fill="#5d4037"/>
    <ellipse cx="108" cy="125" rx="3.5" ry="5" fill="#5d4037"/>

    <!-- Friendly Smile -->
    <path d="M 92 134 Q 100 141 108 134" stroke="#5d4037" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
